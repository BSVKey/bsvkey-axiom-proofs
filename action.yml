name: AXLE Lean proof check
description: >-
  Check every Lean file in a folder with Axiom's AXLE (no local Lean install),
  after a plain-Lean guard that refuses metaprogramming and trust escapes.
  NO PRIVACY: files are sent in plain text to Axiom's servers.
author: BSVKey
branding:
  icon: check-circle
  color: green

inputs:
  path:
    description: Folder of .lean files to check (searched recursively, .lake skipped)
    default: proofs
  environment:
    description: AXLE Lean environment, for example lean-4.35.0
    default: lean-4.35.0
  api-key:
    description: Optional AXLE API key for higher rate limits
    default: ""
  parallel:
    description: Requests in flight at once (keep low without an API key)
    default: "2"
  results:
    description: Folder to write one JSON result per file
    default: axle-results
  axle:
    description: >-
      Run the plain-Lean guard and send the files to AXLE. Set "false" (with
      kernel-replay "true") to check on this runner only, with nothing sent to Axiom.
    default: "true"
  kernel-replay:
    description: >-
      Also compile the files with the official Lean toolchain on this runner,
      replay every declaration through Lean's kernel (leanchecker) and audit
      each theorem's axioms. Catches files that add a theorem with the kernel
      check turned off, which AXLE's verify_proof accepts by design. Slower:
      installs Lean and, if a file imports Mathlib, Mathlib's prebuilt cache.
    default: "false"
  mathlib:
    description: Kernel replay only. Add Mathlib to the Lake project (true, false or auto)
    default: auto
  allowed-axioms:
    description: Kernel replay only. Comma-separated axioms each theorem may use
    default: propext,Classical.choice,Quot.sound

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - if: inputs.axle != 'true' && inputs.kernel-replay != 'true'
      shell: bash
      run: echo "::error::axle and kernel-replay are both off, so nothing would be checked"; exit 1
    - if: inputs.axle == 'true'
      shell: bash
      run: python -m pip install --quiet -r "$GITHUB_ACTION_PATH/requirements.txt"
    - if: inputs.axle == 'true'
      shell: bash
      env:
        AXLE_PROOFS_DIR: ${{ inputs.path }}
        AXLE_RESULTS_DIR: ${{ inputs.results }}
        AXLE_ENVIRONMENT: ${{ inputs.environment }}
        AXLE_API_KEY: ${{ inputs.api-key }}
        AXLE_PARALLEL: ${{ inputs.parallel }}
      run: python "$GITHUB_ACTION_PATH/tools/axle_verify.py"

    # ---- optional: independent kernel replay (no AXLE involved) ----
    - if: inputs.kernel-replay == 'true'
      id: kernel
      shell: bash
      env:
        AXLE_PROOFS_DIR: ${{ inputs.path }}
        AXLE_ENVIRONMENT: ${{ inputs.environment }}
        KERNEL_DIR: .axle-kernel
        KERNEL_MATHLIB: ${{ inputs.mathlib }}
      run: python "$GITHUB_ACTION_PATH/tools/kernel_replay.py" prepare
    - if: inputs.kernel-replay == 'true'
      shell: bash
      working-directory: .axle-kernel
      env:
        MATHLIB: ${{ steps.kernel.outputs.mathlib }}
      run: |
        # Official Lean via elan; the toolchain is the one in lean-toolchain.
        if ! command -v lake >/dev/null; then
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
        fi
        lake update                                   # resolves dependencies, writes lake-manifest.json
        if [ "$MATHLIB" = "true" ]; then lake exe cache get; fi   # Mathlib's prebuilt cache
        lake build
    - if: inputs.kernel-replay == 'true'
      shell: bash
      env:
        AXLE_RESULTS_DIR: ${{ inputs.results }}
        AXLE_ENVIRONMENT: ${{ inputs.environment }}
        KERNEL_DIR: .axle-kernel
        KERNEL_AXIOMS: ${{ inputs.allowed-axioms }}
      run: python "$GITHUB_ACTION_PATH/tools/kernel_replay.py" check
